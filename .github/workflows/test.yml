name: Test Homebrew cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check for a published cask
        id: packages
        shell: bash
        run: |
          if [[ -f Casks/unreal-agent.rb ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Put Homebrew on PATH
        if: steps.packages.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Install from this tap and test every command
        if: steps.packages.outputs.ready == 'true'
        shell: bash
        run: |
          brew update
          brew tap unreallabsai/tap "$GITHUB_WORKSPACE"
          brew install unreallabsai/tap/unreal-agent
          unreal-agent -version
          unreal-agent-tui -version
          uat -version
          unreal-agent-runner -h
